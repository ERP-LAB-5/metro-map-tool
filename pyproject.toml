[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "metro-map-tool"
dynamic = ["version"]
description = "Transit-map diagrams for landscapes, pipelines and roadmaps, rendered to a standalone SVG"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "D-LAB-5" }]
keywords = ["diagram", "svg", "metro map", "transit map", "roadmap", "gantt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Presentation",
]

# metro_map itself is standard library only. Flask is the designer's, and mcp
# is the agent server's; both console scripts below are installed, so both are
# required rather than optional extras.
dependencies = ["flask>=3.0", "mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/ERP-LAB-5/metro-map-tool"
Source = "https://github.com/ERP-LAB-5/metro-map-tool"
Issues = "https://github.com/ERP-LAB-5/metro-map-tool/issues"

# Somebody else's importer joins the tool by declaring the entry-point group
# "metro_map_tool.sources" in their own pyproject, pointing at a Source object:
#
#     [project.entry-points."metro_map_tool.sources"]
#     gitlab = "metro_map_gitlab:SOURCE"
#
# The three that ship here are named in sources/__init__.py rather than
# declared here, because a checkout has no installed metadata for entry points
# to be found in — and run.sh and the MCP server both run from a checkout.

[project.scripts]
metro-map = "metro_map_tool.metro_map:main"
metro-map-designer = "metro_map_tool.app:main"
metro-map-mcp = "metro_map_tool.mcp_server:main"
metro-map-skill = "metro_map_tool.skill_install:main"

[tool.setuptools]
packages = ["metro_map_tool", "metro_map_tool.sources"]

# Flask resolves templates/ and static/ relative to app.py, and app.py resolves
# shared-maps/ the same way, so all three have to be installed beside it — and
# VERSION with them, since that is what the About box reads. skill/ ships so an
# install can hand the agent skill over without the repository.
[tool.setuptools.package-data]
metro_map_tool = ["VERSION", "templates/*.html", "static/*", "shared-maps/*.json",
                  "skill/*.md"]

[tool.setuptools.dynamic]
version = { file = "metro_map_tool/VERSION" }
